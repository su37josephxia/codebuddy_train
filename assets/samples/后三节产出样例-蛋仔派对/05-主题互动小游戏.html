<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主题互动小游戏 · 接蛋仔</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(180deg,#fff4d6,#ffe0a3);min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 16px;color:#5a3d00;overflow:hidden}
  .tag{background:#ff8a00;color:#fff;border-radius:999px;padding:6px 16px;font-size:12px;margin-bottom:12px}
  h1{font-size:26px;color:#c25a00;margin-bottom:4px}
  .sub{font-size:13px;color:#9a6a10;margin-bottom:16px}
  .bar{display:flex;gap:24px;background:#fff;border-radius:12px;padding:12px 28px;margin-bottom:16px;font-size:16px;box-shadow:0 3px 10px rgba(224,122,0,.15)}
  .bar b{color:#e63946;font-size:20px}
  .arena{position:relative;width:420px;max-width:92vw;height:440px;background:#fff;border-radius:20px;box-shadow:0 6px 24px rgba(224,122,0,.2);overflow:hidden;border:3px solid #ffb800}
  .egg{position:absolute;font-size:40px;cursor:pointer;user-select:none;line-height:1;transition:transform .1s}
  .egg:active{transform:scale(1.3)}
  .cover{position:absolute;inset:0;background:rgba(255,244,214,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
  .cover h2{font-size:24px;color:#c25a00}
  .cover p{font-size:15px;color:#8a5a00;line-height:1.7}
  .btn{background:linear-gradient(180deg,#ffb800,#ff8a00);color:#fff;border:none;border-radius:999px;padding:13px 40px;font-size:18px;font-weight:600;cursor:pointer;box-shadow:0 4px 0 #c25a00}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c25a00}
  .foot{margin-top:16px;font-size:12px;color:#a87a20}
</style>
</head>
<body>
  <div class="tag">第 5 节产出 · 主题互动小游戏（可玩）</div>
  <h1>接蛋仔 · 30 秒挑战</h1>
  <p class="sub">点中冒出来的蛋仔得分，点空扣分——现场排队时玩一局</p>

  <div class="bar">
    <span>得分 <b id="score">0</b></span>
    <span>剩余 <b id="time">30</b> 秒</span>
  </div>

  <div class="arena" id="arena">
    <div class="cover" id="cover">
      <h2>🥚 接蛋仔</h2>
      <p>规则：30 秒内点中冒出的🥚得 1 分，点错地方扣 1 分。<br>玩法与蛋仔 IP 关联，现场不用学就能玩。</p>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
  </div>

  <div class="foot">样例产出 · 第 02 组 ｜ 由「Skill 定游戏流程 + 专家调玩法与视觉」生成</div>

<script>
  const arena=document.getElementById('arena');
  const cover=document.getElementById('cover');
  const scoreEl=document.getElementById('score');
  const timeEl=document.getElementById('time');
  let score=0,timeLeft=30,spawnTimer,countTimer,playing=false;

  const INTRO='<h2>🥚 接蛋仔</h2><p>规则：30 秒内点中冒出的🥚得 1 分，点错地方扣 1 分。<br>玩法与蛋仔 IP 关联，现场不用学就能玩。</p><button class="btn" id="startBtn">开始游戏</button>';

  function bindStart(){document.getElementById('startBtn').onclick=startGame}
  bindStart();

  function startGame(){
    score=0;timeLeft=30;playing=true;
    scoreEl.textContent=0;timeEl.textContent=30;
    cover.style.display='none';
    arena.querySelectorAll('.egg').forEach(e=>e.remove());
    spawn();
    countTimer=setInterval(()=>{
      timeLeft--;timeEl.textContent=timeLeft;
      if(timeLeft<=0)endGame();
    },1000);
  }

  function spawn(){
    if(!playing)return;
    const egg=document.createElement('div');
    egg.className='egg';
    egg.textContent='🥚';
    const x=Math.random()*(arena.clientWidth-60);
    const y=Math.random()*(arena.clientHeight-60);
    egg.style.left=x+'px';egg.style.top=y+'px';
    egg.onclick=(e)=>{e.stopPropagation();if(!playing)return;score++;scoreEl.textContent=score;egg.remove()};
    arena.appendChild(egg);
    setTimeout(()=>egg.remove(),900);
    spawnTimer=setTimeout(spawn,550+Math.random()*400);
  }

  arena.onclick=()=>{if(!playing)return;score=Math.max(0,score-1);scoreEl.textContent=score};

  function endGame(){
    playing=false;
    clearTimeout(spawnTimer);clearInterval(countTimer);
    arena.querySelectorAll('.egg').forEach(e=>e.remove());
    cover.style.display='flex';
    cover.innerHTML='<h2>时间到！</h2><p>本局得分：<b style="font-size:34px;color:#e63946">'+score+'</b></p><button class="btn" id="againBtn">再玩一次</button>';
    document.getElementById('againBtn').onclick=()=>{
      cover.innerHTML=INTRO;
      bindStart();
      startGame();
    };
  }
</script>
</body>
</html>
