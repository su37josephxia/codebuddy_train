<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活动海报长图 · 蛋仔夏日游园会</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#eceff5;font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:32px 16px}
  .poster{width:750px;max-width:100%;margin:0 auto;background:#fffaf0;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.12)}
  .hero{background:linear-gradient(160deg,#ffd23f 0%,#ff9f1c 55%,#ff6b6b 100%);padding:56px 48px 64px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.16)}
  .badge{display:inline-block;background:#fff;color:#e07a00;border-radius:999px;padding:7px 18px;font-size:13px;font-weight:500;margin-bottom:24px}
  .hero h1{font-size:62px;line-height:1.1;color:#fff;text-shadow:0 3px 0 rgba(224,122,0,.35);letter-spacing:.04em}
  .hero p{font-size:24px;color:#fff9e8;margin-top:18px;letter-spacing:.1em}
  .egg{display:flex;justify-content:center;gap:16px;margin-top:30px}
  .egg div{width:74px;height:96px;background:#fff;border-radius:50% 50% 46% 46%;box-shadow:inset 0 -8px 0 rgba(0,0,0,.06)}
  .sec{padding:44px 48px}
  .sec:nth-child(even){background:#fff}
  .label{display:inline-block;background:#ffecb3;color:#8a5a00;border-radius:6px;padding:5px 14px;font-size:13px;margin-bottom:18px}
  .sec h2{font-size:28px;color:#2b2b33;margin-bottom:22px}
  .items{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .item{background:#fff8e6;border:1px solid #ffe3a3;border-radius:12px;padding:18px 20px}
  .item b{display:block;font-size:17px;color:#e07a00;margin-bottom:6px}
  .item span{font-size:14px;color:#5b5d66;line-height:1.6}
  .info{display:flex;gap:12px;flex-wrap:wrap}
  .info div{flex:1;min-width:180px;background:#f7f8fb;border-radius:12px;padding:18px 20px}
  .info small{display:block;color:#9a9ea8;font-size:12px;margin-bottom:6px}
  .info strong{font-size:17px;color:#2b2b33}
  .gift{display:flex;gap:12px;flex-wrap:wrap}
  .gift div{flex:1;min-width:150px;text-align:center;border:2px dashed #ffc93c;border-radius:12px;padding:22px 10px;font-size:15px;color:#7a5a00}
  .foot{background:#2b2b33;color:#fff;text-align:center;padding:40px 48px}
  .foot h3{font-size:26px;margin-bottom:12px}
  .foot p{font-size:15px;color:#c9cbd1;margin-bottom:22px}
  .foot a{display:inline-block;background:#ffb800;color:#2b2b33;text-decoration:none;border-radius:8px;padding:12px 28px;font-size:15px;font-weight:500;margin-bottom:14px}
  .foot small{display:block;color:#8e919a;font-size:12px}
</style>
</head>
<body>
<div class="poster">
  <div class="hero">
    <div class="badge">第 4 节产出 · 物料② 活动宣传长图</div>
    <h1>蛋仔夏日<br>游园会</h1>
    <p>陪蛋仔过夏天 · 一整天，玩个够</p>
    <div class="egg"><div></div><div></div><div></div><div></div></div>
  </div>

  <div class="sec">
    <div class="label">活动亮点</div>
    <h2>来现场，玩这些</h2>
    <div class="items">
      <div class="item"><b>巨型蛋仔装置</b><span>随手拍都出片，打卡首选</span></div>
      <div class="item"><b>闯关挑战赛</b><span>三组关卡，赢了拿限定周边</span></div>
      <div class="item"><b>毛绒兑换区</b><span>玩家最想要的，都安排上了</span></div>
      <div class="item"><b>游戏试玩区</b><span>现场组队，直接开玩</span></div>
    </div>
  </div>

  <div class="sec">
    <div class="label">活动信息</div>
    <h2>什么时候，在哪里</h2>
    <div class="info">
      <div><small>时间</small><strong>8 月周末 13:00–20:00</strong></div>
      <div><small>地点</small><strong>XX 商场中庭</strong></div>
      <div><small>对象</small><strong>蛋仔玩家及朋友</strong></div>
    </div>
  </div>

  <div class="sec">
    <div class="label">现场福利</div>
    <h2>来了就能拿</h2>
    <div class="gift">
      <div>毛绒玩偶</div><div>限定徽章</div><div>贴纸明信片</div>
    </div>
  </div>

  <div class="foot">
    <h3>扫码报名，一起滚进夏天</h3>
    <p>报名后现场领入场攻略，限量周边先到先得</p>
    <a href="https://wj.qq.com/s2/292192/abc123" target="_blank" rel="noopener">填写腾讯问卷报名 →</a>
    <small>样例产出 · 第 02 组 · 素材来自游戏官网</small>
  </div>
</div>
</body>
</html>
